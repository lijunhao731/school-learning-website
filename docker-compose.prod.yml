services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # CentOS 7 老内核 seccomp 白名单缺少 PG16 initdb 使用的系统调用，需禁用
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-school_learning}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 不暴露 DB 端口到外部

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-school_learning}
      LLM_API_KEY: ${LLM_API_KEY:-gpustack_53402c89fc1b8ff0_7f055b69257ea707820ef6fae0804aa3}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://36.133.77.84:64025/v1}
      LLM_MODEL_PREFERRED: ${LLM_MODEL_PREFERRED:-mm-l2}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-mm-l1}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      # 外网 60080 -> 服务器 3000 -> caddy:80 -> app:3000
      - "3000:80"
      - "3443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
  caddy_data:
  caddy_config:
