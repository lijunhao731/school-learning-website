      - generic [ref=f2e718]: 小数乘整数是指一个因数是小数，另一个因数是整数的乘法运算。其核心思想是将小数乘法转化为整数乘法进行计算，再根据小数位数确定积的小数点位置。基本法则是：先按照整数乘法的法则算出积，再看因数中有几位小数，就从积的右边起数出几位，点上小数点。若积的位数不够，需要在前面补0再点上小数点。
